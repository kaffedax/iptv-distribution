  :root{
    --bg:#0a0a0e; --panel:#131318; --panel2:#1b1b23; --border:#26262f; --border2:#33333f;
    --text:#f2f2f6; --dim:#8e8e9c; --dim2:#5c5c68;
    --acc1:#f5a623; --acc2:#ff5e3a;
    --grad:linear-gradient(135deg,var(--acc1),var(--acc2));
    --acc-dim:rgba(var(--acc-rgb),.13); --acc-border:rgba(var(--acc-rgb),.4);
    --on-acc:#111; --acc-rgb:245,150,40; --bg-rgb:10,10,14; /* text på accentknappar + accentfärgen som r,g,b för skuggor/glöd */
    --red:#ff6b6b; --red-bg:rgba(255,60,60,.1);
    --r:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{scrollbar-color:#333 transparent}
  body{background:var(--bg);color:var(--text);font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;overflow-x:clip;font-optical-sizing:auto}
  #app{overflow-x:clip;max-width:100vw} /* body:s clip förs över till fönstret och räcker inte på mobil – ett för brett element får aldrig göra sidan scrollbar i sidled */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:#2c2c38;border-radius:99px;border:2px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:#3d3d4c}
  ::-webkit-scrollbar-track{background:transparent}
  body::before{content:"";position:fixed;inset:-20%;background:
    radial-gradient(700px 380px at 18% 2%,rgba(var(--acc-rgb),.09),transparent 70%),
    radial-gradient(800px 420px at 85% -4%,rgba(255,94,58,.07),transparent 70%),
    radial-gradient(900px 500px at 50% 110%,rgba(120,80,255,.05),transparent 70%);
    pointer-events:none;z-index:0;animation:aurora 26s ease-in-out infinite alternate}
  @keyframes aurora{from{transform:translate3d(-2.5%,-1.5%,0) scale(1)}to{transform:translate3d(2.5%,2%,0) scale(1.06)}}
  @media(prefers-reduced-motion:reduce){body::before{animation:none}*{scroll-behavior:auto!important}}
  /* ── TV-läge (webOS m.fl.): inga blur-lager, ingen aurora, inga tunga skuggor ── */
  html.tv body::before{display:none}
  html.tv *,html.tv *::before,html.tv *::after{backdrop-filter:none!important;-webkit-backdrop-filter:none!important;animation:none!important;transition:none!important} /* v4.81.0 (PLAN5): övergångarna (fokus-skala, bildtoning, kantfärger) stod för nästan all seghet vid bläddring på TV:n – mätt med CPU 6×: 31 → 2 långa uppgifter */
  html.tv .poster,html.tv .hm-cw,html.tv .sch,html.tv .cat{box-shadow:none}
  html.tv .spinner{animation:spin .75s linear infinite!important}
  html.tv .live-pill::before{animation:pulse 1.4s infinite!important}
  html.tv .playerwrap::before{display:none}
  html.tv .videobox{box-shadow:none}
  html.tv .poster:hover{transform:none;box-shadow:none}
  html.tv .poster .img img{transition:none}
  html.tv header{background:rgba(var(--bg-rgb),.97);padding-top:calc(10px + env(safe-area-inset-top,0px))}

  .poster:hover{transform:translateY(-4px) scale(1.015);border-color:var(--acc-border);box-shadow:0 16px 34px rgba(0,0,0,.45),0 0 0 1px var(--acc-border)}
  .poster .img::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(8,8,12,.55));opacity:0;transition:opacity .2s}
  .poster:hover .img::after{opacity:1}

  /* v4.77.3: affischer långt utanför skärmen ritas inte (370+ filmer i en kategori ska kännas som 20) */

  .poster .img{aspect-ratio:2/3;background:var(--panel2);position:relative;display:flex;align-items:center;justify-content:center;color:var(--dim2);font-size:24px}

  .poster .pacts{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:5px;opacity:0;transition:.15s}
  .poster:hover .pacts,.poster .pacts:has(.on){opacity:1}
  @media(hover:none){.poster .pacts,.cat .star{display:none}} /* pekskärm: inga knappar på affischer/grupprader (som Netflix) – detaljen har Min lista */
  .pacts .mini{background:rgba(0,0,0,.68);backdrop-filter:blur(4px);color:#cfcfda}
  .pacts .mini.on{color:var(--acc1)}

  /* ═══ Hidden manager ═══ */

  /* ═══ SERIES PANEL ═══ */

  @keyframes fade{from{opacity:0}}

  @keyframes slide{from{transform:translateY(40px);opacity:0}}

  .sheet .cover{width:96px;aspect-ratio:2/3;border-radius:12px;object-fit:cover;background:var(--panel2);flex-shrink:0}

  .sheet .close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}

  .eplist{padding:12px 14px 24px}

  .ep p{font-size:13.5px;font-weight:600}

  /* ═══ Toast ═══ */
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);display:flex;align-items:center;gap:10px;background:rgba(var(--bg-rgb),.78);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border:1px solid rgba(255,255,255,.1);color:var(--text);font-size:13.5px;font-weight:600;padding:11px 18px 11px 14px;border-radius:99px;z-index:100;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 12px 36px rgba(0,0,0,.45);max-width:90vw;text-align:left}
  #toast svg.i{width:18px;height:18px;color:var(--acc1);flex-shrink:0}#toast.warn svg.i{color:var(--red)}
  body.light #toast{border-color:rgba(0,0,0,.08)}
  #toast.show{opacity:1;transform:translateX(-50%)}

  .statbox{position:absolute;top:10px;left:10px;z-index:6;background:rgba(10,10,16,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border2);border-radius:14px;padding:12px 14px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d9d9e4;line-height:1.85;min-width:210px;max-width:75%;animation:up .2s ease}
  .statbox .sb-title{font-weight:800;font-size:12px;color:var(--acc1);margin-bottom:4px;padding-right:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:inherit}
  .statbox .k{color:var(--dim2)}
  .statbox .sb-close{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:7px;color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center}
  .statbox .sb-close:hover{background:rgba(255,255,255,.1)}
  .statbox select{width:100%;margin-top:8px;background:var(--panel2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-size:12px;padding:6px 8px;outline:none;font-family:inherit}
  .usagebar{height:10px;background:var(--panel2);border:1px solid var(--border);border-radius:99px;overflow:hidden;margin-top:6px}
  .usagefill{height:100%;width:0;border-radius:99px;transition:width .4s}
  .checkrow{display:flex;align-items:center;gap:10px;margin-top:16px;padding:13px 14px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;cursor:pointer;user-select:none}
  .checkrow input{width:19px;height:19px;accent-color:var(--acc1);cursor:pointer;flex-shrink:0}
  .checkrow div p{font-size:13.5px;font-weight:700}
  .checkrow div small{font-size:12px;color:var(--dim);line-height:1.4;display:block;margin-top:2px}
  /* ── Profilväljare (Netflix-stil) ── */
  .picker-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:30px 20px;animation:up .4s ease}
  .picker-title{font-size:clamp(24px,4.5vw,38px);font-weight:800;letter-spacing:-.8px}
  .picker-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:clamp(14px,3vw,30px);max-width:760px}
  .ptile{display:flex;flex-direction:column;align-items:center;gap:11px;width:clamp(88px,17vw,128px);transition:transform .18s}
  .ptile:hover{transform:scale(1.06)}
  .pav{position:relative;width:100%;aspect-ratio:1;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:clamp(36px,7vw,56px);border:3px solid transparent;transition:border-color .18s;box-shadow:0 12px 30px rgba(0,0,0,.4)}
  .ptile:hover .pav,body.kbnav .ptile:focus .pav{border-color:#fff}
  .ptile.add .pav{background:var(--panel2);color:var(--dim);border:2px dashed var(--border2);box-shadow:none}
  .pname{font-size:14px;font-weight:600;color:var(--dim)}
  .ptile:hover .pname{color:var(--text)}
  .kidbadge{position:absolute;bottom:-6px;right:-6px;font-size:18px;background:var(--panel);border-radius:50%;padding:3px;border:1px solid var(--border2)}
  .pedit{position:absolute;inset:0;border-radius:19px;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;font-size:26px}
  body.managing .ptile:not(.add) .pedit{display:flex}
  body.managing .ptile[data-pid="guest"] .pedit{display:none}
  .picker-manage{font-size:13px;padding:10px 18px}
  .avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin-top:4px}
  .avpick{aspect-ratio:1;border-radius:11px;background:var(--panel2);border:2px solid var(--border);font-size:21px;display:flex;align-items:center;justify-content:center;transition:.12s}
  .avpick.on{border-color:var(--acc1);background:var(--acc-dim)}
  /* ── Avatarknapp + meny ── */
  .avbtn{padding:0;box-shadow:0 0 0 2px rgba(255,255,255,.14)}
  .avmini{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
  .avmini.sm{width:26px;height:26px;font-size:14px;border-radius:8px}
  .profmenu{position:fixed;top:calc(var(--hh,55px) + 6px);right:12px;z-index:60;background:var(--panel);border:1px solid var(--border2);border-radius:16px;min-width:230px;box-shadow:0 20px 50px rgba(0,0,0,.55);overflow:hidden;animation:up .16s ease;padding:6px}
  .perfout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;line-height:1.5;white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px;max-height:52vh;overflow:auto;color:var(--text);user-select:text}
  html.tv .perfout{font-size:19px;max-height:56vh}
  .pmhead{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--border);margin-bottom:5px;width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;border-radius:12px 12px 0 0}
  .pmhead:hover,.pmhead:focus-visible{background:var(--panel2)}
  .pmchev{margin-left:auto;color:var(--dim2);font-size:20px;line-height:1}
  .pmhead b{font-size:14px;display:block}
  .pmhead small{font-size:12px;color:var(--dim)}
  .profmenu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font-size:13.5px;font-weight:600;padding:10px 12px;border-radius:10px;color:var(--text)}
  .profmenu button:hover{background:var(--panel2)}
  .profmenu button.danger{color:var(--red)}
  .profmenu hr{border:none;border-top:1px solid var(--border);margin:5px 0}
  /* ── Spellisterader i inställningar ── */
  .plrow{display:flex;align-items:center;gap:3px;padding:4px;background:var(--panel2);border:1px solid var(--border);border-radius:11px;margin-bottom:6px}
  .plrow.on{border-color:var(--acc-border);background:var(--acc-dim)}
  .plname{flex:1;min-width:0;text-align:left;font-size:13.5px;font-weight:700;padding:8px 6px 8px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pldot{color:var(--acc1);margin-right:4px}
  .plinfo-in{font-size:12px;color:var(--dim);background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:-2px 0 8px;line-height:1.8;font-family:ui-monospace,Menlo,Consolas,monospace}
  .plinfo-in .k{color:var(--dim2)}
  .plinfo-in .warn{color:var(--red);font-weight:700}
  .loadwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:70px 0;color:var(--dim);font-size:13px}
  .poster .img.loading{background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
  .schskel{display:block;height:11px;width:58%;margin-top:5px;border-radius:6px}
  .skel{border-radius:14px;background:linear-gradient(100deg,var(--panel) 40%,var(--panel2) 50%,var(--panel) 60%);background-size:200% 100%;animation:sh 1.2s infinite}
  @keyframes sh{to{background-position:-200% 0}}
  .banner{background:var(--red-bg);border:1px solid rgba(255,60,60,.35);color:var(--red);font-size:13px;border-radius:14px;padding:14px 16px;line-height:1.6;word-break:break-word}
  #sentinel{height:10px}
  /* ── OLED: Zen-läge – UI tonas bort under uppspelning ── */
  header,aside,.npbar,.epg{transition:opacity .6s ease}
  body.zen{cursor:none}
  body.zen #app{transform:none!important} /* OLED-pixelflytten (transform på #app) gjorde #app till referens för den fasta helskärmsbilden → ibland svart tredjedel */
  body.zen header,body.zen aside,body.zen .npbar,body.zen .epg,body.zen .toolbar,body.zen .statbox,body.zen .backdrop{opacity:0;pointer-events:none}
  body.zen .playerwrap,body.zen .playerwrap.playing,html.tv body.zen .playerwrap.playing,html.tv body.zen.miniplayer .playerwrap.playing{position:fixed;top:0;right:0;bottom:0;left:0;width:auto;height:auto;max-width:none;margin:0;z-index:60;transform:none}
  body.zen .videobox,html.tv body.zen .playerwrap.playing .videobox{border-radius:0;border:none;box-shadow:none;height:100%;width:100%;aspect-ratio:auto;max-width:none}
  body.zen .videobox video{width:100%;height:100%;object-fit:contain;background:#000}
  body.zen.zenfill .videobox video{object-fit:cover}
  @media(orientation:portrait) and (pointer:coarse){html:not(.tv) body.zen.zenfill .videobox video{object-fit:contain}} /* upprätt telefon: fyll aldrig (klipper vänster/höger) */
  body.zen .playerwrap::before,body.zen #home,body.zen .mini-x,body.zen .mini-max{display:none!important}
  /* ── OLED: skärmsläckare ── */
  #saver{position:fixed;inset:0;background:#000;z-index:300;cursor:none}
  #saver .sv{position:absolute;color:rgba(255,255,255,.28);font-weight:600;transition:top 22s linear,left 22s linear}
  #saver .sv b{font-size:56px;font-weight:300;letter-spacing:2px;display:block}
  #saver .sv small{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.14)}

  @media(max-width:760px){
    .menu-btn{display:block}
    .wm{display:none}
    header{padding:8px 10px;grid-template-columns:1fr 1fr;grid-template-rows:auto auto}
    /* Flikarna längst ner, där tummen når. Egen nav utanför headern – headerns backdrop-filter skulle låsa position:fixed. */
    header .sections{display:none}
    header{grid-template-rows:auto}
    .btabs{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:36;gap:0;border-radius:0;justify-self:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:linear-gradient(rgba(var(--bg-rgb),.88),rgba(var(--bg-rgb),.97));backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-top:1px solid var(--border)}
    .btabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 4px 5px;font-size:12px;font-weight:700;border-radius:12px;color:var(--dim)}
    .btabs button svg.i{width:23px;height:23px;margin:0}
    .btabs button.on{background:none;color:var(--acc1)}
    body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
    aside{bottom:calc(66px + env(safe-area-inset-bottom))}
    #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
    body.zen .btabs{display:none}
    .settings-panel{bottom:calc(66px + env(safe-area-inset-bottom))} /* bottenraden syns och går att trycka på – stänger panelen */
    .btabs{z-index:39}
    body.zen{padding-bottom:0}
    aside{position:fixed;left:0;top:var(--hh,96px);bottom:0;background:var(--bg);z-index:35;transform:translateX(-100%);transition:transform .22s;max-height:none;box-shadow:20px 0 50px rgba(0,0,0,.5)}
    aside.open{transform:none}
    main{padding:12px}
    .grid-poster{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:9px}
    .videobox{border-radius:14px}
    .playerwrap.playing .videobox{box-shadow:0 16px 44px rgba(0,0,0,.7)}
    .rndlbl{display:none}
    .tbtn{padding:0 14px}
  }

  /* ═══════════════════════════════════════════════════════════════════
     TV-LÄGE – 10-fots-UI (webOS på 1920×1080 CSS-px, 77" från soffan)
     Allt ~1,7× större, Netflix-fokus (vit ram + lätt skala), minispelare
     när man bläddrar VOD/serier under uppspelning. Ligger sist → vinner.
     ═══════════════════════════════════════════════════════════════════ */
  html.tv{--r:18px}
  html.tv body{font-size:20px}

  html.tv header{padding:14px 40px;gap:20px}
  html.tv header .logo,html.tv header .brand .logo{width:52px;height:52px;border-radius:15px;font-size:28px}
  html.tv .wordmark{font-size:24px}
  html.tv .byline{font-size:19px;letter-spacing:2.5px}
  html.tv .sections{padding:6px;border-radius:18px;gap:6px}
  html.tv .sections button{font-size:22px;padding:12px 32px;border-radius:13px}
  html.tv .icobtn{width:58px;height:58px;border-radius:15px}
  html.tv .icobtn svg{width:28px;height:28px}
  html.tv .avmini{width:46px;height:46px;font-size:25px;border-radius:13px}
  /* Sidopanel (kanallistan) */
  /* v4.77.8: långt tryck på kort ska ge vår meny, inte textmarkering/Androids meny */
  .poster,.sch,.cat,.hm-cw{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html.tv aside{width:420px;padding:20px 16px} /* v4.73.0: smalare (var 540) – mer plats åt innehållet */
  html.tv .catsearch{padding:20px 4px 12px;margin-top:-20px;top:-20px}
  html.tv .catsearch input{font-size:20px;padding:15px 20px;border-radius:15px}
  html.tv aside h3{font-size:19px;letter-spacing:3px;padding:0 16px;margin:26px 0 12px}
  html.tv .cat,html.tv .sch{font-size:22px;padding:14px 12px 14px 20px;border-radius:15px;gap:10px;margin-bottom:3px}
  html.tv .cat .nm{gap:10px}
  html.tv .cat .n{font-size:19px}
  html.tv .cat .star{display:none}
  html.tv .cat .ghide{font-size:19px}
  html.tv .mini{width:42px;height:42px;font-size:21px;border-radius:11px}
  html.tv .rchip{font-size:19px;padding:3px 10px}
  /* Spelare + nu-spelas */
  html.tv main{padding:24px 40px}
  html.tv .videobox,html.tv .playerwrap{max-width:none}
  /* v4.80.3: vanligt läge på TV – bilden får aldrig trycka ut infon under (Nu/Sen, knapparna). Höjden styr bredden (16:9). */
  html.tv body:not(.zen):not(.miniplayer) .playerwrap.playing .videobox{width:min(100%,calc((100dvh - var(--hh,84px) - 300px) * 16 / 9));margin:0}
  html.tv .videobox{border-radius:22px}
  html.tv .playerwrap.playing{top:calc(var(--hh,84px) + 12px)}
  html.tv .npbar{gap:18px;margin:22px 4px 8px;min-height:44px}
  html.tv .npbar b{font-size:27px}
  html.tv .live-pill{font-size:19px;padding:8px 16px;gap:9px}
  html.tv .live-pill::before{width:8px;height:8px}
  html.tv .ratebtn{font-size:19px;padding:10px 20px}
  html.tv .npctl{gap:8px}
  html.tv .npctl .mini.wide{height:46px;font-size:19px;padding:0 18px;min-width:52px}
  html.tv .epg{font-size:20px;line-height:1.6;margin-top:6px}
  html.tv .overlay{font-size:22px;gap:18px}
  html.tv .overlay .big{font-size:76px}
  html.tv .overlay.errbox{padding:40px;font-size:24px;gap:14px}
  html.tv .overlay.errbox span{font-size:20px!important}
  html.tv .spinner{width:64px;height:64px;border-width:4px}
  /* Verktygsrad + rutnät (VOD/serier) */
  html.tv .toolbar{gap:14px;margin:22px 0 20px}
  html.tv .search input{font-size:20px;padding:18px 22px 18px 60px;border-radius:17px}
  html.tv .search svg{width:25px;height:25px;left:22px}
  html.tv .tbtn{height:64px;font-size:19px;padding:0 24px;border-radius:17px;gap:10px}
  html.tv .count{font-size:19px;margin-bottom:18px}
  html.tv .bulk,html.tv .unhide,html.tv .chip{font-size:19px;padding:10px 18px;border-radius:12px}
  html.tv .grid-live{grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
  html.tv .ch{padding:14px;gap:16px;border-radius:18px}
  html.tv .ch .icon{width:64px;height:64px;border-radius:14px;font-size:24px}
  html.tv .ch .meta p{font-size:20px}
  html.tv .ch .meta small{font-size:19px;margin-top:4px}
  html.tv .grid-poster{grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:22px;padding:10px 10px 90px}

const perf={
  t0:Date.now(),marks:[],

  add(name,ms,note){this.seq++;if(this.marks.length>=200)this.marks.splice(40,1); // uppstarten (de första 40) behålls, sedan rullande – långa TV-kvällar blir aldrig inaktuella

  async arun(name,fn,note){const t=performance.now();try{return await fn()}finally{this.add(name,performance.now()-t,note)}},
  kb(n){return n==null?"":Math.round(n/1024)+" kB"},
  /* Fyra tal som gör rapporter jämförbara utan att man räknar själv.
     OBS: uppstarten mäts på FÖRSTA ritningen – tar man den sista mäter man när man senast tryckte. */
  summary(){
    const first=n=>this.marks.find(x=>x.name.startsWith(n))||null;
    const u=[first("rita startsidan"),first("rita listan"),first("rita sidopanelen")].filter(Boolean).sort((a,b)=>a.at-b.at)[0]; // sidopanelen räknas också: startar appen direkt på en kanal ritas startsidan först när man lämnar den

      switchMax:sw.length?Math.max(...sw.map(x=>x.ms)):null,switchN:sw.length,
      zapMed:med(zap),zapN:zap.length,zapMax:zap.length?zap[zap.length-1]:null,filmMed:med(film),filmN:film.length};
  },
  report(local){

      "",
      `KLAR ATT ANVÄNDA: ${sm.usable==null?"–":sm.usable+" ms"}`,
      `TV-GUIDE PÅ PLATS: ${sm.guide==null?"– (inte hämtad)":sm.guide+" ms"}`,
      `LÄNGSTA FRYSNING: ${sm.jank?sm.jank+" ms":"ingen"}`,
      `LÅNGSAMMASTE FLIKBYTE: ${sm.switchMax==null?"– (inga)":sm.switchMax+" ms av "+sm.switchN+" byten"}`,
      `KANALSTART (tryck → bild): ${sm.zapMed==null?"– (ingen kanal startad)":"median "+sm.zapMed+" ms, sämsta "+sm.zapMax+" ms av "+sm.zapN}`,
      `FILMSTART (tryck → bild): ${sm.filmMed==null?"– (ingen film startad)":"median "+sm.filmMed+" ms av "+sm.filmN}`,
      (()=>{const L=state.data?.live?.items;if(!L)return "ARKIV (se från början): – (kanalerna inte laddade)";let n=0,d=0;for(const it of L)if(+it.tv_archive){n++;d=Math.max(d,+it.tv_archive_duration||0)}
        return `ARKIV (se från början): ${n?`${n} av ${L.length} kanaler, upp till ${d} dagar bakåt`:`inga kanaler (av ${L.length}) – via hemmaservern syns det först efter nästa listsynk (Hemmaserver → Uppdatera utbud)`}`})(),
      (()=>{const lg=this.marks.filter(x=>x.name.startsWith("logga: ")&&/^appen( \(via hemmaservern\))?: /.test(x.note||""));if(!lg.length)return state._logoBusy?"LOGGOR: testar… (vänta 10 s och kopiera igen)":"LOGGOR: – (inte testade)";
        const ok=lg.filter(x=>/^appen( \(via hemmaservern\))?: OK/.test(x.note)).length,sv=lg.filter(x=>/(via hemmaservern|direkt från leverantören): OK/.test(x.note)).length,svN=lg.filter(x=>/ · (via hemmaservern|direkt från leverantören): /.test(x.note)).length,alt=lg.some(x=>/direkt från leverantören/.test(x.note))?"direkt":"via hemmaservern";
        return `LOGGOR: ${ok} av ${lg.length} laddas i appen${svN?` · ${sv} av ${svN} ${alt}`:""}${state._logoBusy?" (testar fortfarande…)":""}`})(),
      "",""];
    for(const m of this.marks)L.push(`${String(m.at).padStart(6)} ms  +${String(m.ms).padStart(6)} ms  ${m.name}${m.note?"  ("+m.note+")":""}`);

let _pinClose=null;
function askPin(title,sub,collect){

  return new Promise(res=>{
    $("#pin-holder")?.remove();
    const holder=document.createElement("div");holder.id="pin-holder";
    holder.innerHTML=`<div class="sheet-bg" id="pin-bg"></div><div class="sheet pin" id="pin-sheet"><div class="pinbox"><small>${ico("lock")} Föräldralås</small><h2>${esc(title)}</h2>${sub?`<p>${esc(sub)}</p>`:""}
      <div class="pindots" id="pin-dots"><i></i><i></i><i></i><i></i></div>
      <div class="pinpad" id="pin-pad">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button class="pinkey" data-k="${k}">${k}</button>`).join("")}</div>
      <button class="btn ghost" id="pin-cancel">Avbryt</button></div></div>`;
    document.body.appendChild(holder);
    let buf="",tries=0;
    const dots=()=>holder.querySelectorAll("#pin-dots i").forEach((d,i)=>d.classList.toggle("on",i<buf.length));
    let closed=false;
    const done=v=>{if(closed)return;closed=true;if(_pinClose===cancel)_pinClose=null;document.removeEventListener("keydown",onKey,true);holder.remove();res(v)};
    const cancel=()=>done(collect?null:false);_pinClose=cancel;
    const check=()=>{
      if(closed||buf.length!==4)return; // ⌫ inom 150 ms efter fjärde siffran → ingen kontroll på tre siffror
      if(collect)return done(buf);
      if(pinHash(buf)===profiles.pin)return done(true);
      tries++;const box=holder.querySelector(".pinbox");if(box){box.classList.remove("shake");void box.offsetWidth;box.classList.add("shake")}
      toast(tries>=3?"🔒 Fel PIN tre gånger":"Fel PIN – försök igen");buf="";dots();
      if(tries>=3)done(false);
    };

    $("#pin-pad").onclick=e=>{const b=e.target.closest(".pinkey");if(b)press(b.dataset.k)};
    $("#pin-cancel").onclick=()=>done(collect?null:false);$("#pin-bg").onclick=()=>done(collect?null:false);
    const onKey=e=>{
      if(/^\d$/.test(e.key)){press(e.key);e.preventDefault()}
      else if(e.key==="Backspace"){press("⌫");e.preventDefault()}
      else if(e.key==="Escape"||e.keyCode===461){done(collect?null:false);e.preventDefault()}
    };
    document.addEventListener("keydown",onKey,true);
    kbOn();$("#pin-pad .pinkey")?.focus({preventScroll:true});
  });
}

  if(m){const sch=/^https?$/i.test(m[1])?m[1].toLowerCase():(/^h?t?t?p?s$/i.test(m[1])?"https":"http");return sch+"://"+m[2]}
  return a;
}
function parseXtreamUrl(raw){
  raw=fixScheme(raw);
  try{
    if(!/^https?:\/\//i.test(raw))raw="http://"+raw;
    const u=new URL(raw);
    const user=u.searchParams.get("username"),pass=u.searchParams.get("password");
    if(user&&pass)return{host:u.origin,username:user,password:pass};
    const parts=u.pathname.split("/").filter(Boolean);
    const off=["live","movie","series"].includes(parts[0])?1:0;
    if(parts.length>=off+2)return{host:u.origin,username:parts[off],password:parts[off+1]};
  }catch{}
  return null;
}

/* ─── Smart API-fetch ─── */
/* Diagnostik innehåller bara kända åtgärder, status och fasta felkoder.
   Aldrig URL, användarnamn, lösenord, svarstext eller godtyckligt felmeddelande. */
async function apiFetch(params,options={}){
  const s={...state.settings},q=new URLSearchParams(params),action=q.get("action")||"account";
  const known=new Set(["account","get_live_categories","get_live_streams","get_vod_categories","get_vod_streams","get_series_categories","get_series","get_vod_info","get_series_info","get_short_epg"]);
  const label=known.has(action)?action:"other",start=performance.now();
  let status=0,kind="nätfel",mime="okänd",bytes=0,endpoint="okänd adress",headersAt=null,bodyAt=null;
  try{
    const raw=`${s.host}/player_api.php?username=${encodeURIComponent(s.username)}&password=${encodeURIComponent(s.password)}&${params}`;
    const address=new URL(raw);endpoint=(address.protocol==="https:"?"HTTPS":"HTTP")+" port "+(address.port||(address.protocol==="https:"?"443":"80"));
    const r=await fetch(raw,{signal:options.signal||AbortSignal.timeout(12000),credentials:"omit",cache:"no-store"});
    headersAt=Math.round(performance.now()-start);
    status=r.status;
    const type=(r.headers.get("content-type")||"").split(";")[0].toLowerCase();
    mime=type.includes("json")?"JSON":type==="text/html"?"HTML":type.startsWith("text/")?"text":"annat";
    if(!r.ok){kind="HTTP-fel";throw new Error("Leverantören svarade HTTP "+status)}
    let text;
    if(options.maxBytes){
      const max=options.maxBytes,reader=r.body?.getReader();if(!reader)throw new Error("Programdata kunde inte läsas säkert");
      const parts=[];let size=0;try{if(Number(r.headers.get('content-length'))>max)throw new Error("Programdata är för stor");for(;;){const {value,done}=await reader.read();if(done)break;size+=value.length;if(size>max)throw new Error("Programdata är för stor");parts.push(value)}const data=new Uint8Array(size);let at=0;for(const part of parts){data.set(part,at);at+=part.length}text=new TextDecoder('utf-8',{fatal:true}).decode(data)}finally{await reader.cancel().catch(()=>{})}
    }else text=await r.text();
    bytes=text.length;bodyAt=Math.round(performance.now()-start);
    let data;try{data=JSON.parse(text)}catch{
      kind=/can't[^\r\n]{0,100}port/i.test(text.slice(0,300))?"textfel-port":"ej-JSON";
      throw new Error("Anslutningen gav ett textsvar i stället för katalogdata ("+kind+"). Prova samma hämtning på wifi.");
    }
    kind="OK";state.fetchMode="direct";state.workingProxy=null;return data;
  }catch(e){
    if(e?.name==="TimeoutError"||e?.name==="AbortError"){kind="timeout";throw new Error("Leverantören svarade inte inom 12 sekunder (direct)")}
    if(kind==="nätfel")throw new Error("Kunde inte ansluta direkt till leverantören");
    throw e;
  }finally{
    const cn=navigator.connection,net=cn?.type;
    let network=["wifi","cellular","ethernet","none"].includes(net)?net:"okänt";
    try{const native=window.IPTVShell?.networkInfo?.();if(native&&/^[a-z0-9;= ]{1,160}$/.test(native))network=native}catch{}
    perf.add("leverantör: "+label,performance.now()-start,`${kind} · HTTP ${status||"–"} · ${mime} · ${bytes} tecken · headers ${headersAt===null?"saknas":headersAt+" ms"} · svar ${bodyAt===null?"ofullständigt":bodyAt+" ms"} · ${endpoint} · nät ${network}`);
  }
}

const EP={live:["get_live_categories","get_live_streams"],vod:["get_vod_categories","get_vod_streams"],series:["get_series_categories","get_series"]};

/* ═══ DAGLIG SYNK FRÅN HEMMASERVERN ═══════════════════════════════════════════════════════════
   TV:n och Pixeln kör appen på file://, där inga CORS-spärrar gäller – därför gick varje start rakt
   till leverantören: sex anrop och flera MB JSON att parsa på svag CPU. Nu hämtar Chromebooken
   listorna kl 03 (server.js → /__sync) och appen hämtar hem den färdiga, bantade bundlen EN gång per
   dygn. Andra starten samma dag rör varken servern eller leverantören.
   IndexedDB, inte localStorage – bundlen är flera MB. Saknas den (gammal webOS, privat läge) hämtas
   den från servern varje start, vilket fortfarande är långt snabbare än leverantören.
   Går något fel faller vi tillbaka på den gamla vägen: appen ska aldrig bli oanvändbar för att
   Chromebooken är avstängd. */
const SYNC_DB="iptv-sync",SYNC_STORE="bundles";
function idbOpen(){
  if(_idbP)return _idbP;
  return _idbP=perf.arun("öppna IndexedDB",()=>new Promise((res,rej)=>{
    if(typeof indexedDB==="undefined")return rej(new Error("ingen IndexedDB"));
    let rq;try{rq=indexedDB.open(SYNC_DB,1)}catch(e){return rej(e)}
    rq.onupgradeneeded=()=>{try{rq.result.createObjectStore(SYNC_STORE)}catch{}};
    rq.onsuccess=()=>res(rq.result);
    rq.onerror=()=>rej(rq.error||new Error("IndexedDB"));
  })).catch(e=>{_idbP=null;throw e});
}
let _idbP=null;
function idbGet(k){return idbOpen().then(db=>new Promise((res,rej)=>{const r=db.transaction(SYNC_STORE,"readonly").objectStore(SYNC_STORE).get(k);r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error)}))}
function idbPut(k,v){return idbOpen().then(db=>new Promise((res,rej)=>{const t=db.transaction(SYNC_STORE,"readwrite");t.objectStore(SYNC_STORE).put(v,k);t.oncomplete=()=>res(true);t.onerror=()=>rej(t.error)}))}
/* Kan enheten spara något lokalt alls? På file:// (TV:n och Pixeln) är IndexedDB ibland avstängd,
   och då hämtas allt vid varje start hur bra cachen än är. Vi vill veta det, inte gissa. */
let _idbOk=null;
function idbWorks(){
  if(_idbOk!==null)return Promise.resolve(_idbOk);
  return idbPut("__probe",{at:Date.now()}).then(()=>idbGet("__probe")).then(v=>{_idbOk=!!v;return _idbOk}).catch(()=>{_idbOk=false;return false});
}
const syncKey=()=>`${state.settings?.host||""}|${state.settings?.username||""}`;
const syncDay=()=>new Date().toLocaleDateString("sv-SE"); // "2026-09-21", lokal tid – ett dygn = en synk

let _syncP=null;
async function fetchSync(force){return localCatalogSync(force)}

function ensureSync(force){
  if(!force&&_syncP)return _syncP;
  const p=fetchSync(force).catch(e=>{
    const old=state._syncStale;
    if(old?.sections){if(prefs.debug)toast("Synk misslyckades ("+e.message+") – kör på förra synkens listor");return old}
    throw e;
  });
  _syncP=p;p.catch(()=>{if(_syncP===p)_syncP=null});
  return p;
}
/* Spellistebyte/utloggning: allt som hör till den gamla listan bort, annars visas fel katalog. */
function clearSectionData(){
  localGuideReset();
  try{
    _epgX.clear();_epgGen++;state.epg=null;_epgAllP=null;_epgQueued=null;_fullEpg=null;
    _epgMatchBusy=false;_epgMatchAt=0;clearTimeout(_epgT);_epgQ.clear();_epgW.splice(0).forEach(r=>r(false));
    clearTimeout(state._epgPoll);state._epgPoll=null;state.epgBusy=false;state.epgBuilding=false;
  }catch{} // även pågående svar och köer hör till förra kontot/profilen
  state._dataGen=(state._dataGen|0)+1; // en laddning som startade med förra spellistan får inte skriva in sina listor
  for(const t of localCatalogTimers.values())clearTimeout(t);localCatalogTimers.clear();
  _info.clear();detailRefresh.clear();$("#dholder")?.remove();
  state.data={live:null,vod:null,series:null};
  state._loading=null;state._syncStale=null;state._syncOff=false;_syncP=null;
  memoClear();
}

async function loadSection(sec){return perf.arun("ladda sektion "+sec,()=>_loadSection(sec))}
/* Bara testbygget. Cache per konto/sektion; IDB är lokal, aldrig en nätreserv.
   Bakgrundsförnyelse sparas till nästa start så att en pågående vy/fokus inte byts. */
const LOCAL_CATALOG_PREFIX="direct-catalog:v1:";
const localCatalogJobs=new Map(),localCatalogTimers=new Map();
const LOCAL_CATALOG_FIELDS=["stream_id","series_id","name","category_id","epg_channel_id","stream_icon","cover","backdrop_path","rating","rating_5based","added","last_modified","container_extension","plot","genre","releasedate","releaseDate","release_date","release","year","tv_archive","tv_archive_duration"];
async function localCatalogCompact(items){
  const out=[];
  for(let i=0;i<items.length;i++){
    const o={};
    if(!items[i]||typeof items[i]!=="object")throw new Error("Ogiltig post i leverantörens katalog");
    for(const k of LOCAL_CATALOG_FIELDS)if(items[i][k]!=null&&items[i][k]!=="")o[k]=items[i][k];
    out.push(o);
    if(i&&i%1000===0)await new Promise(r=>setTimeout(r,0));
  }
  return out;
}
const localCatalogKey=(sec,s=state.settings)=>LOCAL_CATALOG_PREFIX+JSON.stringify([s?.host||"",s?.username||"",sec]);
function localCatalogValid(c){return c?.version===1&&Array.isArray(c.data?.cats)&&Array.isArray(c.data?.items)}
async function localCatalogRead(sec,s){
  try{const c=await idbGet(localCatalogKey(sec,s));_idbOk=true;return localCatalogValid(c)?c:null}
  catch{_idbOk=false;return null}
}
async function localCatalogFetch(sec,s,gen){
  const key=localCatalogKey(sec,s),jobKey=key+":"+gen;
  if(localCatalogJobs.has(jobKey))return localCatalogJobs.get(jobKey);
  const job=(async()=>{
    const [cats,items]=await Promise.all(EP[sec].map(action=>apiFetch("action="+action)));
    if(gen!==(state._dataGen|0)||key!==localCatalogKey(sec))throw new Error("Spellistan byttes under hämtningen");
    if(!Array.isArray(cats)||!Array.isArray(items))throw new Error("Leverantören returnerade ingen giltig katalog");
    const compact=await localCatalogCompact(items);
    if(gen!==(state._dataGen|0))throw new Error("Spellistan byttes under bearbetningen");
    const c={version:1,day:syncDay(),fetched:Date.now(),saved:true,data:{cats,items:compact}};
    try{await idbPut(key,c);_idbOk=true}
    catch{c.saved=false;_idbOk=false;perf.add("lokala listor: kunde inte spara",0,"Listan fungerar nu men kan behöva hämtas igen efter omstart")}
    return c;
  })();
  localCatalogJobs.set(jobKey,job);
  job.finally(()=>{if(localCatalogJobs.get(jobKey)===job)localCatalogJobs.delete(jobKey)}).catch(()=>{});
  return job;
}
function localCatalogRefreshLater(sec,s,gen){
  const key=localCatalogKey(sec,s)+":"+gen;
  if(localCatalogTimers.has(key))return;
  localCatalogTimers.set(key,setTimeout(()=>{
    // Behåll markören under sessionen: ett fel ska inte bli en anropsstorm.
    if(gen!==(state._dataGen|0)||localCatalogKey(sec,s)!==localCatalogKey(sec))return;
    localCatalogFetch(sec,s,gen).then(()=>perf.add("lokala listor: förnyade "+sec,0,"Visas nästa start eller efter manuell uppdatering"))
      .catch(()=>perf.add("lokala listor: behåller sparad "+sec,0,"Bakgrundshämtningen misslyckades"));
  },1500));
}
async function _loadSection(sec){
  if(state.data[sec])return state.data[sec];
  const loading=state._loading||={};
  if(loading[sec])return loading[sec];
  const gen=state._dataGen|0,s={...state.settings};
  const job=(async()=>{
    const c=await perf.arun("lokala listor: läs "+sec,()=>localCatalogRead(sec,s));
    if(gen!==(state._dataGen|0))throw new Error("Spellistan byttes under läsningen");
    if(c){
      setSection(sec,c.data);
      perf.add("lokala listor: cache "+sec,0,(c.day===syncDay()?"dagens":"äldre")+" · "+c.data.items.length+" poster");
      if(c.day!==syncDay()&&prefs.sync.lists==="auto")localCatalogRefreshLater(sec,s,gen);
      return state.data[sec];
    }
    perf.add("lokala listor: saknas "+sec,0,"Behöver hämtas från leverantören");
    const fresh=await localCatalogFetch(sec,s,gen);
    if(gen!==(state._dataGen|0))throw new Error("Spellistan byttes under hämtningen");
    setSection(sec,fresh.data);return state.data[sec];
  })();
  loading[sec]=job;
  job.finally(()=>{if(loading[sec]===job)delete loading[sec]}).catch(()=>{});
  return job;
}
async function localCatalogSync(force,onProgress){
  const gen=state._dataGen|0,s={...state.settings},sections={},counts={},failed=[];let fetched=Infinity;
  for(const sec of ["live","vod","series"]){
    onProgress?.(sec);
    try{
      const c=force?await localCatalogFetch(sec,s,gen):await localCatalogRead(sec,s);
      if(gen!==(state._dataGen|0))throw new Error("Spellistan byttes under uppdateringen");
      if(c){sections[sec]=c.data;counts[sec]=c.data.items.length;fetched=Math.min(fetched,c.fetched||0)}
      if(c?.saved===false)failed.push(sec);
    }catch{
      if(gen!==(state._dataGen|0))throw new Error("Spellistan byttes under uppdateringen");
      failed.push(sec);
    }
  }
  if(failed.length)throw new Error("Uppdateringen är ofullständig: "+failed.map(x=>({live:"TV",vod:"filmer",series:"serier"}[x])).join(", ")+" kunde inte hämtas och sparas. Tidigare sparade listor finns kvar.");
  return {fetched:Number.isFinite(fetched)?fetched:0,sections,counts};
}
function wireLocalCatalogSettings(){
  const button=$("#hs-sync"),info=$("#hs-syncinfo"),mode=$("#f-local-lists");
  if(!button||!info)return;
  if(mode)mode.onchange=()=>{prefs.sync.lists=mode.value;savePrefs()};
  const show=async()=>{
    const b=await localCatalogSync(false);
    if(!info.isConnected)return;
    info.textContent=[['live','TV'],['vod','filmer'],['series','serier']].map(([sec,label])=>b.counts[sec]==null?label+": inte sparad":label+": "+b.counts[sec]+" sparade").join(" · ");
  };
  show().catch(()=>{if(info.isConnected)info.textContent="Kunde inte läsa sparade listor"});
  button.onclick=async()=>{
    const gen=state._dataGen|0;
    button.disabled=true;button.textContent="Hämtar och sparar…";
    try{
      const b=await localCatalogSync(true,sec=>{if(info.isConnected)info.textContent="Hämtar "+({live:"TV",vod:"filmer",series:"serier"}[sec])+"…"});
      if(gen!==(state._dataGen|0))return;
      clearSectionData();
      for(const sec of ["live","vod","series"])if(b.sections[sec])setSection(sec,b.sections[sec]);
      await switchSection(state.section,true);renderHome();
      toast("Alla tre listor har sparats på enheten");
    }catch(e){if(gen===(state._dataGen|0))toast(e.message,6000)}
    finally{
      if(info.isConnected&&gen===(state._dataGen|0))await show();
      // En lyckad uppdatering ökar generationen genom clearSectionData.
      else if(info.isConnected&&state.settings)await show();
      button.disabled=false;button.textContent="Synka listorna nu";
    }
  };
}

function collectPlaylistForm(){
  const proxy=$("#f-proxy").value.trim();
  const name=$("#f-plname").value.trim();
  const linkVal=$("#f-link")?.value.trim()||"";
  const hostVal=$("#f-host")?.value.trim()||"";
  // Tomt formulär i appen = inga spellisteändringar
  if(!linkVal&&!hostVal)return null;
  let cfg=null;
  if($("#pane-link").style.display!=="none"){
    cfg=parseXtreamUrl(linkVal);
    if(!cfg)throw new Error("Kunde inte tolka länken – prova fliken Manuellt.");
  }else{
    let host=fixScheme(hostVal).replace(/\/+$/,"");
    const user=$("#f-user").value.trim(),pass=$("#f-pass").value.trim();
    if(!host||!user||!pass)throw new Error("Fyll i server, användarnamn och lösenord.");
    if(!/^https?:\/\//i.test(host))host="http://"+host;
    cfg={host,username:user,password:pass};
  }
  cfg.proxy=proxy;
  cfg.name=name||hostName(cfg.host);
  return cfg;
}

function wireSettingsForm(inApp,onSaved){
  const showPane=l=>{$("#pane-link").style.display=l?"":"none";$("#pane-manual").style.display=l?"none":"";$("#tab-link").classList.toggle("on",l);$("#tab-manual").classList.toggle("on",!l)};
  $("#tab-link").onclick=()=>showPane(true);
  $("#tab-manual").onclick=()=>showPane(false);
  if($("#f-light"))$("#f-light").onchange=e=>document.body.classList.toggle("light",e.target.checked);
  if($("#f-passeye"))$("#f-passeye").onclick=()=>{
    const f=$("#f-pass"),hidden=f.type==="password";
    f.type=hidden?"text":"password";
    $("#f-passeye").textContent=hidden?"Dölj":"Visa";
  };

  const pl=activePlaylist()||{};
  const fullLink=pl.host?`${pl.host}/get.php?username=${encodeURIComponent(pl.username)}&password=${encodeURIComponent(pl.password)}&type=m3u_plus`:""; // & # + % i lösenordet bröt länken
  $$("[data-copy]").forEach(b=>b.onclick=async()=>{
    const map={link:fullLink,host:pl.host,user:pl.username,pass:pl.password};
    if(b.dataset.copy==="share"&&navigator.share){try{await navigator.share({title:"IPTV",text:fullLink})}catch{}return}
    const txt=map[b.dataset.copy]??fullLink;
    try{await navigator.clipboard.writeText(txt)}
    catch{const t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}
    toast("📋 Kopierat");
  });

  // Spellisteraderna
  if(inApp)$$(".plrow").forEach(row=>{
    const id=row.dataset.pl;

/* Spellisteinfo: giltighet, anslutningar, innehåll */
async function showPlaylistInfo(pl){
  const box=$("#plinfo-"+pl.id);
  if(box.innerHTML){box.innerHTML="";return}
  box.innerHTML=`<div class="loadwrap" style="padding:14px 0"><div class="spinner" style="width:22px;height:22px"></div></div>`;
  try{
    const base=`${pl.host}/player_api.php?username=${encodeURIComponent(pl.username)}&password=${encodeURIComponent(pl.password)}`;
    const get=async q=>{
      const raw=base+q;
      const urls=mixedBlocked(raw)?[]:[raw];
      for(const p of proxyCandidates())urls.push(p+encodeURIComponent(raw));
      for(const url of [...new Set(urls)]){
        try{const r=await fetch(url,{signal:AbortSignal.timeout(15000)});if(r.ok)return await r.json()}catch{}
      }
      throw new Error("nätverksfel");
    };
    const acc=await get("");
    const u=acc?.user_info||{};
    const exp=u.exp_date?new Date(+u.exp_date*1000).toLocaleDateString("sv-SE"):"–";
    const daysLeft=u.exp_date?Math.ceil((+u.exp_date*1000-Date.now())/864e5):null;
    // Innehållsräkning: återanvänd laddad data om det är aktiva listan, annars hämta
    // Förut hämtades hela katalogerna (flera MB, ~40 000 poster) bara för att räkna dem – det kunde frysa TV:n.
    // Nu: det som redan finns i minnet eller i dagens synk; resten räknas bara på knapptryck.
    let counts={};
    const syncC=pl.id===playlists.activeId?await idbGet(syncKey()).then(c=>c?.counts).catch(()=>null):null;
    for(const sec of ["live","vod","series"]){
      if(pl.id===playlists.activeId&&state.data[sec])counts[sec]=state.data[sec].items.length;
      else counts[sec]=syncC?.[sec]??"–";
    }
    const missing=Object.values(counts).includes("–");
    box.innerHTML=`<div class="plinfo-in">
      <span class="k">Giltig till:</span> ${esc(exp)}${daysLeft!=null?` <span class="${daysLeft<14?"warn":""}">(${daysLeft} dagar kvar)</span>`:""}<br>
      <span class="k">Status:</span> ${esc(u.status||"–")} · <span class="k">Anslutningar:</span> ${esc(String(u.active_cons??"–"))}/${esc(String(u.max_connections??"–"))}<br>
      <span class="k">Innehåll:</span> <span id="plcnt-${esc(pl.id)}">${ico("tv")} ${counts.live} TV · ${counts.vod} filmer · ${counts.series} serier</span>
      ${missing?`<br><button class="mini" id="plcount-${esc(pl.id)}">Räkna innehåll (hämtar hela listorna)</button>`:""}
    </div>`;
    const cb=missing&&box.querySelector("button.mini");
    if(cb)cb.onclick=async()=>{
      cb.disabled=true;cb.innerHTML=ico("clock")+"Räknar…";
      for(const sec of ["live","vod","series"])if(counts[sec]==="–"){const arr=await get("&action="+EP[sec][1]).catch(()=>null);counts[sec]=Array.isArray(arr)?arr.length:"–"}
      const sp=box.querySelector("[id^=plcnt-]");if(sp)sp.textContent=`${counts.live} TV · ${counts.vod} filmer · ${counts.series} serier`;cb.remove();
    };
  }catch(e){
    box.innerHTML=`<div class="plinfo-in warn">Kunde inte hämta info (${esc(e.message)})</div>`;
  }
}

/* ⏱ Prestanda: vad tog tid, på den här enheten. Går att kopiera och klistra in i en chatt. */
/* 🖼 Loggdiagnos: provar några kanalloggor på riktigt – som appen laddar dem och via hemmaservern – så man ser
   svart på vitt om det är leverantörens loggserver eller appen. Körs när Prestanda öppnas. */
async function logoDiag(onStep){state._logoBusy=true;try{return await logoDiag2(onStep)}finally{state._logoBusy=false}}
async function logoDiag2(onStep){
  const d=state.data?.live;if(!d?.items?.length){perf.add("logga: inga kanaler laddade",0);return}
  const byId=sectionById("live");
  const ids=[...(prefs.favs?.live||[]),...(prefs.recents||[]).filter(r=>r.sec==="live").map(r=>r.id)].map(String);
  let pick=[...new Set(ids)].map(id=>byId.get(id)).filter(it=>it&&itemIcon(it));
  if(pick.length<6)pick=pick.concat(d.items.filter(it=>itemIcon(it)&&!pick.includes(it)).slice(0,6-pick.length));
  pick=pick.slice(0,6);
  const hosts=new Map();let n=0;
  for(const it of d.items){const u=itemIcon(it);if(!u)continue;n++;let h;try{h=new URL(u).host}catch{h="(ogiltig adress)"}hosts.set(h,(hosts.get(h)||0)+1)}
  perf.add("logga: kanaler med logga",0,`${n} av ${d.items.length} · servrar: ${[...hosts].sort((a,b)=>b[1]-a[1]).slice(0,3).map(([h,c])=>h+" ("+c+")").join(", ")||"–"}`);
  const load=src=>new Promise(res=>{const t=performance.now(),im=new Image();let done=false,to=0;
    const fin=r=>{if(done)return;done=true;clearTimeout(to);im.onload=im.onerror=null;res({r,ms:Math.round(performance.now()-t)})};
    to=setTimeout(()=>{fin("INGET SVAR på 10 s");im.src=""},10000);
    im.onload=()=>fin(im.naturalWidth?`OK ${im.naturalWidth}×${im.naturalHeight}`:"laddad men tom (0×0)");
    im.onerror=()=>fin("FEL (404, nekad eller trasig bild)");
    im.src=src});
  await Promise.all(pick.map(async it=>{
    const u=itemIcon(it),viaSrv=imgUrl(u)!==u,a=await load(imgUrl(u));
    let other="";if(homeServer()){const b=await load(viaSrv?u:srvUrl("/__img","url="+encodeURIComponent(u)));other=viaSrv?` · direkt från leverantören: ${b.r} (${b.ms} ms)`:` · via hemmaservern: ${b.r} (${b.ms} ms)`}
    perf.add("logga: "+String(it.name||"").slice(0,24),a.ms,`appen${viaSrv?" (via hemmaservern)":""}: ${a.r}${other} · ${String(u).slice(0,80)}`);
    onStep&&onStep();
  }));
}
function openPerf(){
  $("#perfpanel")?.remove();
  const el=document.createElement("div");
  el.id="perfpanel";el.className="settings-panel";
  let txt=perf.report();
  el.innerHTML=`<div class="settings-card">
    <div class="shead"><h2>${ico("clock")} Prestanda</h2><button class="icobtn" id="perf-x" title="Stäng">${ico("x")}</button></div>
    <p class="hint">Tiderna är uppmätta på den här enheten, i den ordning de hände. Första kolumnen = millisekunder sedan appen startade, andra = hur lång tid steget tog.</p>
    <pre class="perfout" id="perf-out">${esc(txt)}</pre>
    <div class="copyrow">
      <button type="button" class="chip" id="perf-copy">${ico("copy")} Kopiera</button>
      <button type="button" class="chip" id="perf-reload">↻ Mät om från start</button>
      <button type="button" class="chip" id="perf-logo">${ico("image")} Testa loggor</button>
    </div></div>`;
  document.body.appendChild(el);
  const runLogo=()=>{const b=$("#perf-logo");b.disabled=true;b.innerHTML=ico("clock")+"Testar loggor…";
    const upd=()=>{if(!el.isConnected)return;txt=perf.report();$("#perf-out").textContent=txt}; // uppdateras löpande – och Kopiera tar alltid färsk text
    upd();
    logoDiag(upd).catch(e=>perf.add("logga: diagnosen föll",0,e.message)).then(()=>{upd();if(!el.isConnected)return;b.disabled=false;b.innerHTML=ico("image")+"Testa loggor igen"})};
  $("#perf-logo").onclick=runLogo;
  /* Från hemmaservern: fel från ALLA enheter + de andra enheternas senaste rapport (sammanfattningen), så TV:ns
     rapport kan kopieras från mobilen. Allt hamnar i samma text som Kopiera tar. */
  if(homeServer()){
    const me=deviceLabel().replace(/[^A-Za-z0-9åäöÅÄÖ_-]+/g,"-");
    Promise.all([
      fetch(srvUrl("/__log","kind=fel&n=25"),{signal:AbortSignal.timeout(8000)}).then(r=>r.ok?r.text():"").catch(()=>""),
      fetch(srvUrl("/__log","kind=list"),{signal:AbortSignal.timeout(8000)}).then(r=>r.ok?r.json():[]).catch(()=>[]),
      fetch(srvUrl("/__log","kind=srv&n=40"),{signal:AbortSignal.timeout(8000)}).then(r=>r.ok?r.text():"").catch(()=>"")
    ]).then(async([fel,list,srv])=>{
      const others=(Array.isArray(list)?list:[]).filter(x=>x.dev!==me).sort((a,b)=>b.at-a.at).slice(0,3);
      const parts=["── FRÅN HEMMASERVERN ──",fel.trim()?"Senaste fel (alla enheter):\n"+fel.trim().split("\n").slice(-15).join("\n"):"Inga fel sparade på servern."];
      if(srv.trim())parts.push("Serverns logg (senaste 40, undertexter/guide/TMDB m.m.):\n"+srv.trim()); // v4.81.1: svaret på "varför kom ingen undertext?" står ofta här
      for(const o of others){
        const t=await fetch(srvUrl("/__log","kind=perf&dev="+encodeURIComponent(o.dev)),{signal:AbortSignal.timeout(8000)}).then(r=>r.ok?r.text():"").catch(()=>"");
        if(t)parts.push(`── ${o.dev} (${new Date(o.at).toLocaleString("sv-SE",{dateStyle:"short",timeStyle:"short"})}) ──\n`+t.split("\n").slice(0,o.dev===others[0].dev?140:16).join("\n")); // senaste enheten (oftast TV:n) i sin helhet
      }
      perf.remote=parts.join("\n\n");if(el.isConnected){txt=perf.report();$("#perf-out").textContent=txt}
    });
  }
  if(!state._logoDiag){state._logoDiag=true;runLogo()} // en gång per start av sig själv – svaret hamnar i rapporten
  $("#perf-x").onclick=()=>el.remove();
  $("#perf-reload").onclick=()=>location.reload();
  $("#perf-copy").onclick=async()=>{
    const b=$("#perf-copy");
    txt=perf.report();$("#perf-out").textContent=txt;
    try{await navigator.clipboard.writeText(txt);b.innerHTML=ico("check")+"Kopierad"}
    catch{ // TV:n har sällan urklipp – markera i stället så man kan fota eller kopiera för hand
      const r=document.createRange();r.selectNodeContents($("#perf-out"));
      const sel=getSelection();sel.removeAllRanges();sel.addRange(r);
      b.textContent="Markerad – kopiera";
    }
    setTimeout(()=>{b.innerHTML=ico("copy")+"Kopiera"},2500);
  };
  $("#perf-out").focus?.();
}

/* ═══════════ TMDB & TRAILERS (via hemmaservern, kräver nyckel) ═══════════ */
/* "SE: Oppenheimer (2023) 4K HDR" → {title:"Oppenheimer", year:"2023"} */
const _ptC=new Map(); // v4.77.6: samma namn tolkas tusentals gånger per ritning (sortering, rader, TMDB) – regexarna kostade mest vid flikbyten
function parseTitle(name){
  const c=_ptC.get(name);if(c)return{title:c.title,year:c.year};
  const r=_parseTitle(name);if(_ptC.size>60000)_ptC.clear();_ptC.set(name,r);return{title:r.title,year:r.year};
}
function _parseTitle(name){
  let t=String(name||"").replace(/^[A-Z]{2,3}\s*[-:|]\s*/,"").replace(/\[[^\]]*\]/g," ");
  let year="";const ym=t.match(/[\(\s\-–]((?:19|20)\d{2})[\)\s]*(?=[^\d]|$)/);if(ym){year=ym[1];t=t.slice(0,ym.index)+" "+t.slice(ym.index+ym[0].length)}
  t=t.replace(/\b(4K|UHD|FHD|HD|SD|HDR|HEVC|H\.?26[45]|x26[45]|1080p|720p|2160p|WEB-?DL|BluRay|BRRip|DVDRip|MULTI|DUAL|NF|AMZN|DSNP|HMAX|SWESUB|SUB|DUBBED|EXTENDED|REMASTERED|UNRATED|DC)\b/gi," ").replace(/[|_]+/g," ").replace(/\s{2,}/g," ").replace(/[\s\-–:]+$/,"").trim();
  return{title:t||String(name||"").trim(),year};
}
const _tmdb=new Map();
/* v4.77.7: TMDB-affischer som redan hittats ritas direkt vid nästa ritning (startsidan ritas om ofta – förr började
   hämtningen om varje gång och bilden hann ibland aldrig fram). TST = räknare i Prestanda-rapporten. */
const _tmdbDone=new Map(),_tmdbPost=new Map(),TST={ask:0,hit:0,miss:0,err:0,obs:0,wait:0,drawn:0};
const tmdbKey=(sec,it)=>{const{title,year}=parseTitle(it.name);return (sec==="series"?"tv":"movie")+"|"+title.toLowerCase()+"|"+year};
function tmdbPosterNow(sec,it){return it&&_tmdbPost.get(tmdbKey(sec,it))||""}
function tmdbInfo(sec,it){
  if(!canTmdb())return Promise.resolve(null);
  const{title,year}=parseTitle(it.name),type=sec==="series"?"tv":"movie",k=type+"|"+title.toLowerCase()+"|"+year;
  if(!_tmdb.has(k)){TST.ask++;_tmdb.set(k,metaFetch("/__tmdb",`type=${type}&q=${encodeURIComponent(title)}&year=${year}`,{signal:AbortSignal.timeout(15000)}).then(r=>{if(!r.ok&&r.status!==404&&r.status!==501)throw new Error("HTTP "+r.status);return r.ok?r.json():null}) /* v4.80.2: serverfel (TMDB 429 m.m.) är inte "finns inte" – försök igen nästa gång */
    .then(j=>{if(j&&j.found){TST.hit++;if(j.poster)_tmdbPost.set(k,j.poster);_tmdbDone.set(k,j);return j}TST.miss++;return null}).catch(()=>{TST.err++;_tmdb.delete(k);return null}))} // en timeout ska inte gälla hela sessionen
  return _tmdb.get(k);
}
/* v4.81.1: YouTube spelar inte inbäddat utan avsändaradress (fel 153) – appen på TV:n och Pixeln körs från file:// och
   har ingen. Hemma bäddas spelaren därför in via hemmaserverns http-adress (/__yt), annars direkt (fungerar på http/https). */
function ytSrc(key,params){

}

/* ═══════════ DETALJER: cache för get_vod_info / get_series_info + hero-panel på TV ═══════════ */
const _info=new Map();
/* Separat DB: katalogcachen kan fortfarande läsas av tidigare testversioner.
   Högst 40 poster à 256 KiB, lokal LRU. Inga tjänster eller mediefiler cachas. */
const DETAIL_LIMIT=40,DETAIL_BYTES=256*1024,DETAIL_TTL=24*3600000;
let detailDbPromise=null;
const detailJobs=new Map(),detailRefresh=new Set();
function detailDb(){
  if(detailDbPromise)return detailDbPromise;
  return detailDbPromise=new Promise((resolve,reject)=>{
    const r=indexedDB.open("iptv-details-cache",1);
    r.onupgradeneeded=()=>{const s=r.result.createObjectStore("records",{keyPath:"key"});s.createIndex("used","used")};
    r.onsuccess=()=>{const db=r.result;db.onversionchange=()=>{db.close();detailDbPromise=null};resolve(db)};
    r.onerror=()=>reject(new Error("Lokal metadatacache kunde inte öppnas"));
  }).catch(e=>{detailDbPromise=null;throw e});
}
function detailAccount(s=state.settings){return JSON.stringify([s?.host||"",s?.username||""])}
function detailKey(sec,id,s=state.settings){return JSON.stringify([detailAccount(s),sec,String(id)])}
function detailValid(sec,value){
  if(!value||typeof value!=="object"||Array.isArray(value))return false;
  if(sec==="series")return !!value.episodes&&typeof value.episodes==="object"&&!Array.isArray(value.episodes);
  return !!value.info&&typeof value.info==="object"&&!Array.isArray(value.info);
}
async function detailRead(key,sec){
  try{
    const db=await detailDb();
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction("records","readwrite"),store=tx.objectStore("records"),r=store.get(key);let result=null;
      r.onsuccess=()=>{const c=r.result;if(c?.version===1&&detailValid(sec,c.value)){c.used=Date.now();store.put(c);result=c}};
      tx.oncomplete=()=>resolve(result);tx.onabort=tx.onerror=()=>reject(new Error("Cacheläsning misslyckades"));
    });
  }catch{return null}
}
async function detailWrite(key,value){
  try{
    // Storleksgränsen mäts i UTF-8-byte, inte JS-tecken.
    const size=new TextEncoder().encode(JSON.stringify(value)).length;
    if(size>DETAIL_BYTES){perf.add("metadata: för stor för lokal cache",0);return}
    const db=await detailDb();
    await new Promise((resolve,reject)=>{
      const tx=db.transaction("records","readwrite"),s=tx.objectStore("records");
      s.put({key,version:1,at:Date.now(),used:Date.now(),value});
      const count=s.count();count.onsuccess=()=>{
        let excess=count.result-DETAIL_LIMIT;if(excess<=0)return;
        const cursor=s.index("used").openCursor();cursor.onsuccess=()=>{const c=cursor.result;if(!c||excess<=0)return;c.delete();excess--;c.continue()};
      };
      tx.oncomplete=()=>resolve();tx.onabort=tx.onerror=()=>reject(new Error("Cacheskrivning misslyckades"));
    });
  }catch{perf.add("metadata: kunde inte spara lokalt",0)}
}
function detailNetwork(sec,id,key,account,gen){
  const jobKey=key+":"+gen;
  if(detailJobs.has(jobKey))return detailJobs.get(jobKey);
  const job=(async()=>{
    if(gen!==(state._dataGen|0)||account!==detailAccount())throw new Error("Spellistan byttes");
    const d=await apiFetch(sec==="series"?"action=get_series_info&series_id="+encodeURIComponent(id):"action=get_vod_info&vod_id="+encodeURIComponent(id));
    if(gen!==(state._dataGen|0)||account!==detailAccount())throw new Error("Spellistan byttes");
    if(!detailValid(sec,d))throw new Error("Leverantören returnerade inga giltiga detaljer");
    await detailWrite(key,d);
    if(gen!==(state._dataGen|0)||account!==detailAccount())throw new Error("Spellistan byttes");
    return d;
  })();
  detailJobs.set(jobKey,job);
  job.finally(()=>{if(detailJobs.get(jobKey)===job)detailJobs.delete(jobKey)}).catch(()=>{});
  return job;
}
function detailInfo(sec,id){
  const key=detailKey(sec,id),account=detailAccount(),gen=state._dataGen|0;
  // Generationen ingår även i minnesnyckeln: återgång till samma konto får inte
  // återanvända ett gammalt pågående svar från före spellistebytet.
  const memoryKey=key+":"+gen;
  if(_info.has(memoryKey)){const p=_info.get(memoryKey);_info.delete(memoryKey);_info.set(memoryKey,p);return p}
  const current=()=>gen===(state._dataGen|0)&&account===detailAccount();
  const job=(async()=>{
    const c=await detailRead(key,sec);
    if(!current())throw new Error("Spellistan byttes");
    if(c){
      perf.add("metadata: lokal cache "+sec,0,Date.now()-c.at<DETAIL_TTL?"aktuell":"äldre");
      if(Date.now()-c.at>=DETAIL_TTL&&!detailRefresh.has(memoryKey)){
        detailRefresh.add(memoryKey);
        // Förnyelse får aldrig blockera den redan sparade titelsidan.
        setTimeout(()=>{
          if(!current())return;
          detailNetwork(sec,id,key,account,gen).then(d=>{
            if(current()&&_info.get(memoryKey)===job)_info.set(memoryKey,Promise.resolve(d));
          }).catch(()=>perf.add("metadata: behåller sparad "+sec,0));
        },1500);
      }
      return c.value;
    }
    perf.add("metadata: hämtar "+sec,0);
    return detailNetwork(sec,id,key,account,gen);
  })();
  _info.set(memoryKey,job);while(_info.size>DETAIL_LIMIT){const oldest=_info.keys().next().value;_info.delete(oldest);detailRefresh.delete(oldest)}
  job.catch(()=>{if(_info.get(memoryKey)===job)_info.delete(memoryKey)});
  return job;
}

async function switchSection(sec,force){const t=performance.now(),p=_switchSection(sec,force),g=state._viewGen;try{return await p}finally{perf.add(g===state._viewGen?"byt till "+sec:"inaktuellt flikbyte "+sec,performance.now()-t)}}
function secAnim(){const m=$("main");if(!m||matchMedia("(prefers-reduced-motion: reduce)").matches)return;m.classList.remove("secin");void m.offsetWidth;m.classList.add("secin")}

/* ── Kanalvy i sidopanelen (TV): grupp → kanaler med sök & sortering ── */
/* ═══════════ LISTA ═══════════ */
/* v4.77.6: hela katalogen sorteras EN gång per ordning (A–Ö / Nyast) och sparas tills listan laddas om; varje vy plockar sedan
   sina titlar ur den i ordning (O(n)). Förr sorterades om vid varje flikbyte med localeCompare + titeltolkning i jämförelsen
   – 120 ms på datorn för 15 000 filmer, flera gånger mer på TV:n. */
const TVUI=()=>document.documentElement.classList.contains("tv");
const _sortC=new WeakMap(),_coll=typeof Intl!=="undefined"&&Intl.Collator?new Intl.Collator("sv",{numeric:true,sensitivity:"base"}):null;
/* v4.77.12: produktionsår för "Nyast". Förr: första 4-siffriga talet i namnet – "Blade Runner 2049 (2017)" blev 2049 och
   "1917 (2019)" blev 1917, och ett datum som "26-09-1994" gav 0. Nu: (år) i namnet först, sedan leverantörens datumfält
   (år var som helst i strängen), sist sista året i namnet. Bara rimliga år (1900 – nästa år). */
function prodYear(x){
  const max=new Date().getFullYear()+1,ok=y=>y>=1900&&y<=max?y:0,n=String(x.name||"");
  let m=n.match(/\((19\d\d|20\d\d)\)/);if(m&&ok(+m[1]))return +m[1];
  for(const f of [x.year,x.releaseDate,x.release_date,x.releasedate,x.release]){const y=String(f||"").match(/(?:^|\D)(19\d\d|20\d\d)(?!\d)/);if(y&&ok(+y[1]))return +y[1]}
  const all=[...n.matchAll(/(?:^|[^\d])(19\d\d|20\d\d)(?![\dp])/gi)].map(z=>ok(+z[1])).filter(Boolean);
  return all.length?all[all.length-1]:0;
}
/* Mätning (v4.77.13): hur "Nyast" ser ut på riktigt – de 6 första i Filmer/Serier med år och leverantörens fält, och hur många saknar år */
function nyastDiag(){try{const L=[];for(const sec of ["vod","series"]){const d=state.data[sec];if(!d)continue;
  let no=0;const best=[];for(const x of d.items){const y=prodYear(x);if(!y){no++;continue}if(best.length<6||y>best[best.length-1][0]){best.push([y,x]);best.sort((a,b)=>b[0]-a[0]);if(best.length>6)best.pop()}}const top=best.map(z=>z[1]); // utan att sortera hela katalogen
  L.push(`Nyast ${sec==="vod"?"filmer":"serier"} (${no} av ${d.items.length} utan år): `+top.map(x=>`${String(x.name||"").slice(0,40)} → ${prodYear(x)}${x.year?" y:"+x.year:""}${x.releaseDate||x.releasedate||x.release_date?" d:"+String(x.releaseDate||x.releasedate||x.release_date).slice(0,10):""}`).join(" | "))}
  return L}catch(e){return ["Nyast: fel "+e.message]}}
/* v4.81.0 (PLAN5): sorterar bara listan som visas (förr hela katalogen, 30 000 filmer – ~1 s på TV:n) och minns
   sorteringsnycklarna per titel; resultatet sparas per lista (nyckel) tills katalogen laddas om. */
const _sortK=new WeakMap();
function sortedVod(sec,items,vsort,key){
  const all=state.data[sec]?.items;if(!all||items.length<2)return items;
  let c=_sortC.get(all);if(!c){c=new Map();_sortC.set(all,c)}
  const ck=key!=null?vsort+"|"+key+"|"+items.length:null;if(ck&&c.has(ck))return c.get(ck);
  const kOf=x=>{let o=_sortK.get(x);if(!o){const p=parseTitle(x.name||"");o={t:p.title||x.name||""};_sortK.set(x,o)}if(vsort==="new"&&o.y==null){o.y=prodYear(x);o.a=addedTs(x)}return o};
  const k=items.map(x=>({x,o:kOf(x)}));
  k.sort(vsort==="new"?(a,b)=>b.o.y-a.o.y||b.o.a-a.o.a:_coll?(a,b)=>_coll.compare(a.o.t,b.o.t):(a,b)=>a.o.t.localeCompare(b.o.t,"sv",{numeric:true,sensitivity:"base"}));
  const out=k.map(z=>z.x);if(ck){if(c.size>40)c.clear();c.set(ck,out)}return out;
}
/* Filtret hör till aktuell grupp. Global sökning ligger kvar i toppraden. */
function applyCategoryFilter(){
  const sec=state.section,cat=state.activeCat[sec]||"all",scope=sec+":"+cat;
  if(state._categoryQueryScope&&state._categoryQueryScope!==scope)state.search="";
  state._categoryQueryScope=scope;
  const show=sec!=="live"&&cat!=="__start";
  document.body.dataset.categoryFilter=show?"on":"off";
  const field=$("#f-search");
  if(field){
    const name=state.data[sec]?.cats.find(c=>String(c.category_id)===String(cat))?.category_name||SEC_LABEL[sec];
    field.placeholder="Filtrera i "+name+"…";field.setAttribute("aria-label","Filtrera i "+name);
    field.value=state.search||"";
  }
}

function currentItems(){
  const sec=state.section,d=state.data[sec];
  const q=state.search.trim().toLowerCase();
  const hidden=new Set(prefs.hidden[sec]);
  const favs=new Set(prefs.favs[sec]);
  const cat=state.activeCat[sec];
  if(cat==="__top"){state.activeCat[sec]="all";return currentItems()} // gammal personlig Toppen-vy → giltig standardvy
  let items;
  if(cat==="__foryou"){
    if(sec==="live"){ // kanaler du faktiskt tittar på: historik och favoriter
      const order=new Map(prefs.recents.filter(r=>r.sec===sec).map((r,i)=>[r.id,i]));
      items=d.items.filter(it=>!hidden.has(itemId(sec,it))).map(it=>{const id=itemId(sec,it);const sc=(order.has(id)?10-Math.min(9,order.get(id)):0)+(favs.has(id)?5:0);return[sc,it]}).filter(x=>x[0]>0).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
    }else items=recommended(sec,200);
  }
  else if(cat==="__hidden")items=d.items.filter(it=>hidden.has(itemId(sec,it)));
  else if(cat==="__favs"){items=d.items.filter(it=>favs.has(itemId(sec,it))&&!hidden.has(itemId(sec,it)));if(sec==="live")items=favSorted(items)}
  else if(cat==="__recent"){
    const order=new Map(prefs.recents.filter(r=>r.sec===sec).map((r,i)=>[r.id,i]));
    items=d.items.filter(it=>order.has(itemId(sec,it))).sort((a,b)=>order.get(itemId(sec,a))-order.get(itemId(sec,b)));
  }
  else if(cat==="__resume"){ // påbörjat men inte klart – senast sedda först
    const order=new Map(prefs.recents.filter(r=>r.sec===sec).map((r,i)=>[r.id,i]));
    items=d.items.filter(it=>resumeInfo(sec,itemId(sec,it))&&!hidden.has(itemId(sec,it)))
      .sort((a,b)=>(order.get(itemId(sec,a))??1e9)-(order.get(itemId(sec,b))??1e9));
  }
  else if(cat==="__provider_top"){const seen=seenIds(sec);items=d.items.filter(it=>provRating(it)>=7.5&&!hidden.has(itemId(sec,it))&&!seen.has(itemId(sec,it))).sort((a,b)=>provRating(b)-provRating(a))}
  else{
    items=d.items.filter(it=>(cat==="all"||String(it.category_id)===cat)&&!hidden.has(itemId(sec,it)));
    if(prefs.favOnly&&sec==="live")items=items.filter(it=>favs.has(itemId(sec,it))); // kanalernas Filter → Favoriter (Filmer/Serier har Min lista)
  }
  if(q)items=items.filter(it=>(it.name||"").toLowerCase().includes(q));
  items=visibleFilter(sec,items);
  return OVERVIEW_CATS.has(cat)?overviewFilter(sec,items):items; // gruppen själv (aktivt vald) visar allt
}

function renderList(){return perf.run("rita listan",_renderList)}
function _renderList(){
  const sec=state.section,d=state.data[sec];if(!d)return;
  if(state.observer){state.observer.disconnect();state.observer=null}
  const tb=$(".toolbar");applyCategoryFilter();
  if(sec==="live"){ // sidopanelen är navigation; huvudytan visar startsidan eller gruppens kanaler
    if(tb)tb.style.display="none";
    const mode=state.liveNav?.mode||"groups";
    renderHome(); // visar sig bara i gruppläget, döljer sig annars
    if(mode==="channels")renderLiveView();
    else{const l=$("#list");if(l)l.innerHTML=""}
    return;
  }
  if(tb)tb.style.display="";
  // 🏠 Start: dina egna listor. Ligger före currentItems() – landningen ska inte röra hela katalogen.
  if(state.activeCat[sec]==="__start"&&!state.search){
    const mode=startMode(sec),list=$("#list");
    const names=new Map(d.cats.map(c=>[String(c.category_id),c.category_name]));
    const favs=startList(sec,"favs"),recent=startList(sec,"recent");
    const items=mode==="favs"?favs:recent;
    const quick=mode==="favs"?recent.filter(it=>resumeInfo(sec,itemId(sec,it))).slice(0,10):[];
    const quickIds=new Set(quick.map(it=>itemId(sec,it)));
    const bbPool=(favs.length?favs:recent).filter(it=>!quickIds.has(itemId(sec,it)));
    const bbPicks=billboardPicks(sec,bbPool),bbIdx=Math.min((state._bbIdx||={})[sec]||0,Math.max(0,bbPicks.length-1));
    state._bbIdx[sec]=bbIdx;const hero=bbPicks[bbIdx],heroId=hero?itemId(sec,hero):"";
    const ownItems=items.filter(it=>!quickIds.has(itemId(sec,it))&&itemId(sec,it)!==heroId);
    const placed=new Set([...quick.map(it=>titlePlacementKey(sec,it)),...ownItems.map(it=>titlePlacementKey(sec,it)),...(hero?[titlePlacementKey(sec,hero)]:[])]);
    list.innerHTML=`<div id="grid" class="vin">`
      +(quick.length?`<section class="shelf startquick${quick.length===1?" one":""}"><h3>Fortsätt där du var</h3><div class="row">${quick.map(it=>posterCard(it,sec,names,false,true)).join("")}</div></section>`:"")
      +`<div class="count startmodes">${START_MODES.map(([m,t])=>`<button class="chip ${m===mode?"on":""}" data-sm="${m}">${t}</button>`).join("")}</div>`
      +`<div class="grid-poster">${ownItems.length?ownItems.map(it=>posterCard(it,sec,names,false)).join("")
        :items.length?"":`<div class="hm-empty"><span>${mode==="favs"?"Stjärnmärk det du vill spara, så blir det här din egen lista.":"Här hamnar det du sett senast."}</span>
            <button class="chip" data-go="all">${SEC_ICON[sec]} Bläddra bland alla ${esc(SEC_LABEL[sec].toLowerCase())}</button>
</div>`}</div></div>`
      +billboardHtml(sec,{pool:bbPool,kick:favs.length?"Från din lista":"Där du var senast"})
      +discoverShelves(sec,names,placed);
    list.querySelector("#grid").addEventListener("click",e=>{
      const go=e.target.closest("[data-go]");if(!go)return;
      state.activeCat[sec]=go.dataset.go;renderSidebar();renderList();
    });
    list.querySelector(".startmodes").onclick=e=>{
      const b=e.target.closest("[data-sm]");if(!b||b.dataset.sm===mode)return;
      uiTick("ok");prefs.startMode[sec]=b.dataset.sm;savePrefs();renderSidebar();renderList();
      $(`.startmodes [data-sm="${b.dataset.sm}"]`)?.focus({preventScroll:true});
    };
    wireBillboard(sec);
    wireGridClicks(sec,d,false);
    restoreFocus($("#grid"),focusKey());
    return;
  }
  let items=currentItems();
  const isHiddenView=state.activeCat[sec]==="__hidden";
  const vcat=state.activeCat[sec],sortable=sec!=="live"&&!["__hidden","__recent","__resume","__top","__foryou","__favs"].includes(vcat);
  const vsort=(prefs.vodSort||{})[sec]||"az";
  const landing0=!state.search&&vcat==="all"&&items.length>40; // "Alla" = rader per grupp – ingen sortering av hela katalogen (v4.81.0)
  if(sortable&&!landing0)items=sortedVod(sec,items,vsort,vcat+"|"+state.search); // v4.77.1: A–Ö eller Nyast först
  const isPoster=sec!=="live";
  const catNames=new Map(d.cats.map(c=>[String(c.category_id),c.category_name]));

  const label={live:"kanaler",vod:"filmer",series:"serier"}[sec];
  if(!state.channel)document.body.classList.remove("fbelow"); // säkerhetsnät: listan döljs aldrig när inget spelar
  state._viewItems={sec,items}; // v4.78.0: filmkön – ⏮/⏭ följer listan (och sorteringen) man startade från
  const landing=!state.search&&state.activeCat[sec]==="all"; // startvyer får billboard
  if(landing&&!isHiddenView&&isPoster&&items.length>40){ // Alla i Filmer/Serier: billboard + en rad per kategori (i stället för 30 000 affischer i ett rutnät)
    $("#list").innerHTML=billboardHtml(sec)+`<div id="grid" class="shelves vin">${catRowsHtml(sec,items,catNames)}</div>`;moreShelves();
    wireBillboard(sec);wireGridClicks(sec,d,false);
    $("#grid").addEventListener("click",e=>{const m=e.target.closest("[data-morecat]");if(!m)return;e.stopPropagation();uiTick("ok");state.activeCat[sec]=m.dataset.morecat;renderSidebar();renderList();window.scrollTo({top:0})},true);
    restoreFocus($("#grid"),focusKey());return;
  }
  let head=`<div class="count"><span>${items.length} ${label}${state.search?` · ”${esc(state.search)}”`:""}</span>${state.search?`<button class="bulk" id="search-clear">${ico("x")} Rensa sökningen</button>`:""}${sortable&&items.length>1?`<div class="seg vsort" role="group" aria-label="Sortering"><button data-vsort="az" class="${vsort==="az"?"on":""}">A–Ö</button><button data-vsort="new" class="${vsort==="new"?"on":""}">Nyast</button></div>`:""}`;
  if(sec==="vod"&&!isHiddenView&&items.length>1)head+=`<button class="bulk" id="shuffle-play" title="Starta en slumpad film – nästa blir också slumpad">${ico("shuffle")} Blanda</button>`; // v4.78.0
  const isRecentView=state.activeCat[sec]==="__recent";
  if(isHiddenView&&items.length)head+=`<button class="bulk" id="unhide-all">${ico("eye")} Visa alla igen</button>`;
  if(isRecentView&&items.length)head+=`<button class="bulk" id="recent-clear">${ico("broom")} Rensa alla</button>`;
  head+=`</div>`;

  const list=$("#list");
  list.innerHTML=(landing&&!isHiddenView?billboardHtml(sec):"")+head+`<div class="${isPoster?"grid-poster":"grid-live"} vin" id="grid"></div><div id="sentinel"></div>`;
  wireBillboard(sec);
  if($("#unhide-all"))$("#unhide-all").onclick=()=>{prefs.hidden[sec]=[];savePrefs();toast("Alla dolda är synliga igen");state.activeCat[sec]="all";renderSidebar();renderList()};
  if($("#search-clear"))$("#search-clear").onclick=()=>{state.search="";const si=$("#f-search");if(si)si.value="";renderList()};
  if($("#shuffle-play"))$("#shuffle-play").onclick=()=>shufflePlay(sec,items);
  list.querySelector(".vsort")?.addEventListener("click",e=>{const b=e.target.closest("[data-vsort]");if(!b||b.classList.contains("on"))return;uiTick("ok");(prefs.vodSort||={})[sec]=b.dataset.vsort;savePrefs();renderList();$(`.vsort [data-vsort="${b.dataset.vsort}"]`)?.focus({preventScroll:true})});
  if($("#recent-clear"))$("#recent-clear").onclick=async()=>{
    if(!(await askConfirm("Rensa Senast spelade?","","Rensa",true)))return;
    prefs.recents=prefs.recents.filter(r=>r.sec!==sec);savePrefs();
    toast("🧹 Historiken rensad");state.activeCat[sec]="all";renderSidebar();renderList();
  };

  if(!items.length){
    const all=()=>{state.search="";const si=$("#f-search");if(si)si.value="";state.activeCat[sec]="all";renderSidebar();renderList()};
    const e=isHiddenView?["eye","Inget är dolt.","",null]:state.search?["search",`Inget matchar ”${state.search}”`,"","Rensa sökningen"]
      :state.activeCat[sec]==="__favs"?["star","Min lista är tom",`Tryck Min lista på ${sec==="vod"?"en film":"en serie"} så hamnar den här.`,"Bläddra bland alla"]
      :state.activeCat[sec]==="__recent"?["clock","Inget spelat än","","Bläddra bland alla"]:["film","Inget här","","Visa alla"];
    $("#grid").innerHTML=emptyHtml(e[0],e[1],e[2],e[3]);if(e[3])$("#empty-act").onclick=all;
    return;
  }

  // Chunkad rendering för 14 000+ objekt
  let idx=0;
  const grid=$("#grid");
  const renderChunk=()=>{
    const end0=idx,end=Math.min(idx+(isPoster?(TVUI()?36:60):CHUNK),items.length); // v4.77.3/v4.81.0: affischer i mindre omgångar (TV:n: 36 ≈ en och en halv skärm)
    let html="";
    for(;idx<end;idx++){
      const it=items[idx];
      html+=isPoster?posterCard(it,sec,catNames,isHiddenView):rowCard(it,sec,catNames,isHiddenView);
    }
    grid.insertAdjacentHTML("beforeend",html);
    if(isPoster&&idx>end0)lazyImgs(grid);
    if(isPoster&&idx>end0&&tmdbIO?.grid===grid)tmdbIO.watch(grid); // v4.77.4: nya omgångar får också TMDB-bilder
    if(idx>=items.length&&state.observer){state.observer.disconnect();state.observer=null}
  };
  renderChunk();
  if(typeof IntersectionObserver!=="undefined"){
    state.observer=new IntersectionObserver(es=>{if(es[0].isIntersecting)renderChunk()},{rootMargin:"900px"});
    state.observer.observe($("#sentinel"));
  }else while(idx<items.length)renderChunk(); // utan IntersectionObserver: rendera allt direkt
  const want=focusMem[focusKey()];if(want){const wi=items.findIndex(it=>itemId(sec,it)===want);while(wi>=idx&&idx<items.length)renderChunk()} // rendera fram till kortet som hade fokus

  wireGridClicks(sec,d,isHiddenView);
  restoreFocus(grid,focusKey());
}

let hlsPromise=null;
function loadHlsLib(){
  if(window.Hls)return Promise.resolve(window.Hls);
  if(hlsPromise)return hlsPromise;
  const urls=["vendor/hls-1.5.13.min.js"]; // paketerad, laddas vid behov
  hlsPromise=new Promise((res,rej)=>{
    const tryNext=i=>{
      if(i>=urls.length)return rej(new Error("hls.js kunde inte laddas"));
      const sc=document.createElement("script");
      sc.src=urls[i];sc.async=true;
      sc.onload=()=>res(window.Hls);
      sc.onerror=()=>tryNext(i+1);
      document.head.appendChild(sc);
    };
    tryNext(0);
  });
  return hlsPromise;
}
